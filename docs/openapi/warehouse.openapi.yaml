  /api/v1/public/share/user/entries:
    get:
      tags: [Directed shares]
      operationId: listDirectedShareEntries
      summary: 列出定向分享目录内容
      parameters:
        - {name: shareId, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: path, in: query, schema: {type: string, default: ""}}
      responses:
        "200":
          description: 目录项列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/ShareEntry"}
        "400": {$ref: "#/components/responses/PlainTextError"}
        "403": {$ref: "#/components/responses/PlainTextError"}
        "404": {$ref: "#/components/responses/PlainTextError"}
        "410": {$ref: "#/components/responses/PlainTextError"}
  /api/v1/public/share/user/download:
    get:
      tags: [Directed shares]
      operationId: downloadDirectedShareFile
      summary: 下载或预览定向分享文件
      parameters:
        - {name: shareId, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: path, in: query, schema: {type: string}}
        - {name: disposition, in: query, schema: {type: string, enum: [inline, attachment], default: attachment}}
      responses:
        "200":
          description: 文件字节
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        "400": {$ref: "#/components/responses/PlainTextError"}
        "403": {$ref: "#/components/responses/PlainTextError"}
        "404": {$ref: "#/components/responses/PlainTextError"}
        "410": {$ref: "#/components/responses/PlainTextError"}
    head:
      tags: [Directed shares]
      operationId: headDirectedShareFile
      summary: 获取定向分享文件元信息
      parameters:
        - {name: shareId, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: path, in: query, schema: {type: string}}
      responses:
        "200": {description: 文件存在}
        "400": {$ref: "#/components/responses/PlainTextError"}
        "403": {$ref: "#/components/responses/PlainTextError"}
        "404": {$ref: "#/components/responses/PlainTextError"}
  /api/v1/public/share/user/upload:
    put:
      tags: [Directed shares]
      operationId: uploadDirectedShareFile
      summary: 向定向分享目录上传文件
      parameters:
        - {name: shareId, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: path, in: query, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        "200": {$ref: "#/components/responses/MessageResponse"}
        "400": {$ref: "#/components/responses/PlainTextError"}
        "403": {$ref: "#/components/responses/PlainTextError"}
        "410": {$ref: "#/components/responses/PlainTextError"}
    post:
      tags: [Directed shares]
      operationId: uploadDirectedShareFilePost
      summary: 使用 POST 向定向分享目录上传文件
      parameters:
        - {name: shareId, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: path, in: query, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        "200": {$ref: "#/components/responses/MessageResponse"}
        "400": {$ref: "#/components/responses/PlainTextError"}
        "403": {$ref: "#/components/responses/PlainTextError"}
  /api/v1/public/share/user/folder:
    post:
      tags: [Directed shares]
      operationId: createDirectedShareFolder
      summary: 在定向分享中创建目录
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SharePathRequest"}
      responses:
        "200": {$ref: "#/components/responses/MessageResponse"}
        "400": {$ref: "#/components/responses/PlainTextError"}
        "403": {$ref: "#/components/responses/PlainTextError"}
  /api/v1/public/share/user/rename:
    post:
      tags: [Directed shares]
      operationId: renameDirectedShareItem
      summary: 重命名定向分享中的文件或目录
      description: 重命名成功后，服务端会同步更新资源所有者名下相关定向分享、公开链接及其子路径引用。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shareId, from, to]
              properties:
                shareId: {type: string, format: uuid}
                from: {type: string, minLength: 1}
                to: {type: string, minLength: 1}
      responses:
        "200": {$ref: "#/components/responses/MessageResponse"}
        "400": {$ref: "#/components/responses/PlainTextError"}
        "403": {$ref: "#/components/responses/PlainTextError"}
  /api/v1/public/share/user/item:
    delete:
      tags: [Directed shares]
      operationId: deleteDirectedShareItem
      summary: 删除定向分享中的文件或目录
      description: 删除成功后，服务端会删除资源所有者名下该路径及其子路径对应的定向分享、公开链接和派生公开链接。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SharePathRequest"}
      responses:
        "200": {$ref: "#/components/responses/MessageResponse"}
        "400": {$ref: "#/components/responses/PlainTextError"}
        "403": {$ref: "#/components/responses/PlainTextError"}
        "404": {$ref: "#/components/responses/PlainTextError"}

  /api/v1/public/uploads/sessions:
    post:
      tags: [Upload sessions]
      operationId: createUploadSession
      summary: 创建可恢复分片上传会话
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateUploadSessionRequest"}
      responses:
        "201":
          description: 上传会话已创建
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UploadSession"}
        "400": {$ref: "#/components/responses/PlainTextError"}
        "403": {$ref: "#/components/responses/PlainTextError"}
        "413": {$ref: "#/components/responses/PlainTextError"}
  /api/v1/public/uploads/sessions/{sessionId}:
    parameters:
      - {name: sessionId, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Upload sessions]
      operationId: getUploadSession
      summary: 获取上传会话和已上传分片
      responses:
        "200":
          description: 上传会话
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UploadSession"}
        "403": {$ref: "#/components/responses/PlainTextError"}
        "404": {$ref: "#/components/responses/PlainTextError"}
    delete:
      tags: [Upload sessions]
      operationId: abortUploadSession
      summary: 取消上传会话
      responses:
        "200":
          description: 会话已取消
          content:
            application/json:
              schema:
                type: object
                required: [aborted]
                properties:
                  aborted: {type: boolean, const: true}
        "403": {$ref: "#/components/responses/PlainTextError"}
        "404": {$ref: "#/components/responses/PlainTextError"}
  /api/v1/public/uploads/sessions/{sessionId}/parts/{partNumber}:
    put:
      tags: [Upload sessions]
      operationId: uploadSessionPart
      summary: 上传一个原始字节分片
      parameters:
        - {name: sessionId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: partNumber, in: path, required: true, schema: {type: integer, minimum: 1}}
        - name: X-Warehouse-Checksum-SHA256
          in: header
          required: true
          description: 分片内容的 64 位十六进制 SHA-256；也兼容 x-amz-checksum-sha256
          schema: {type: string, pattern: "^[0-9a-fA-F]{64}$"}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        "200":
          description: 分片上传成功
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UploadPartResponse"}
        "400": {$ref: "#/components/responses/PlainTextError"}
        "403": {$ref: "#/components/responses/PlainTextError"}
        "404": {$ref: "#/components/responses/PlainTextError"}
  /api/v1/public/uploads/sessions/{sessionId}/complete:
    post:
      tags: [Upload sessions]
      operationId: completeUploadSession
      summary: 合并已上传分片并完成会话
      parameters:
        - {name: sessionId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: 上传完成
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UploadSession"}
        "400": {$ref: "#/components/responses/PlainTextError"}
        "403": {$ref: "#/components/responses/PlainTextError"}
        "404": {$ref: "#/components/responses/PlainTextError"}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT or UCAN
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
  requestBodies:
    IDRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [id]
            properties:
              id: {type: string, format: uuid}
    IDsRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [ids]
            properties:
              ids:
                type: array
                items: {type: string, format: uuid}
    HashRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [hash]
            properties:
              hash: {type: string, minLength: 1}
  parameters:
    AssetObjectPath:
      name: path
      in: query
      required: true
      schema:
        type: string
        pattern: "^/(personal|apps|services)/.+"
      example: /services/knowledge/artifacts/report.md
  responses:
    SDKBadRequest:
      description: 请求参数无效
      content:
        application/json:
          schema: {$ref: "#/components/schemas/SDKError"}
    SDKUnauthorized:
      description: 未认证或凭据无效
      content:
        application/json:
          schema: {$ref: "#/components/schemas/SDKError"}
    SDKNotFound:
      description: 资源不存在
      content:
        application/json:
          schema: {$ref: "#/components/schemas/SDKError"}
    LegacyError:
      description: 旧版 JSON 错误响应
      content:
        application/json:
          schema: {$ref: "#/components/schemas/LegacyError"}
    PlainTextError:
      description: 当前 Handler 使用 http.Error 返回的纯文本错误
      content:
        text/plain:
          schema: {type: string}
    AssetObjectError:
      description: 资产对象接口错误
      content:
        application/json:
          schema: {$ref: "#/components/schemas/AssetObjectError"}
    MessageResponse:
      description: 操作成功
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message: {type: string}
  schemas:
    WalletAddress:
      type: string
      pattern: "^0x[0-9a-fA-F]{40}$"
      example: "0x9AdD99615252CaF379030d8966965BD9e5D80157"
    HealthResponse:
      type: object
      required: [status, uptime, version]
      properties:
        status: {type: string, example: healthy}
        uptime:
          type: integer
          format: int64
          description: Go time.Duration 的纳秒数
        version: {type: string, example: 2.0.0}
    ReadinessCheck:
      type: object
      required: [name, status]
      properties:
        name: {type: string}
        status: {type: string}
        error: {type: string}
    ReadinessResponse:
      type: object
      required: [status, checks]
      properties:
        status: {type: string}
        checks:
          type: array
          items: {$ref: "#/components/schemas/ReadinessCheck"}
    SDKError:
      type: object
      required: [code, message, timestamp]
      properties:
        code:
          oneOf: [{type: integer}, {type: string}]
        message: {type: string}
        data: {type: [object, "null"], additionalProperties: true}
        timestamp: {type: integer, format: int64}
    LegacyError:
      type: object
      required: [error, code, success]
      properties:
        error: {type: string}
        code: {type: integer}
        success: {type: boolean, const: false}
    ChallengeRequest:
      type: object
      required: [address]
      properties:
        address: {$ref: "#/components/schemas/WalletAddress"}
    VerifyWalletRequest:
      type: object
      required: [address, signature]
      properties:
        address: {$ref: "#/components/schemas/WalletAddress"}
        signature: {type: string, example: "0x..."}
    PasswordLoginRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string, minLength: 1}
        password: {type: string, format: password, minLength: 1}
    ChallengeData:
      type: object
      required: [address, challenge, nonce, issuedAt, expiresAt]
      properties:
        address: {$ref: "#/components/schemas/WalletAddress"}
        challenge: {type: string}
        nonce: {type: string}
        issuedAt: {type: integer, format: int64}
        expiresAt: {type: integer, format: int64}
    AuthTokenData:
      type: object
      required: [address, token, expiresAt, refreshExpiresAt]
      properties:
        address: {type: string}
        username: {type: string}
        token: {type: string, writeOnly: true}
        expiresAt: {type: integer, format: int64}
        refreshExpiresAt: {type: integer, format: int64}
    EmailCodeData:
      type: object
      required: [email, expiresAt, retryAfter]
      properties:
        email: {type: string, format: email}
        expiresAt: {type: integer, format: int64}
        retryAfter: {type: integer, minimum: 0, description: 可再次发送前需等待的秒数}
    EmailAuthTokenData:
      type: object
      required: [email, username, token, expiresAt, refreshExpiresAt]
      properties:
        email: {type: string, format: email}
        username: {type: string}
        token: {type: string, writeOnly: true}
        expiresAt: {type: integer, format: int64}
        refreshExpiresAt: {type: integer, format: int64}
    ChallengeEnvelope:
      allOf:
        - $ref: "#/components/schemas/SDKEnvelope"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/ChallengeData"}
    AuthTokenEnvelope:
      allOf:
        - $ref: "#/components/schemas/SDKEnvelope"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/AuthTokenData"}
    EmailCodeEnvelope:
      allOf:
        - $ref: "#/components/schemas/SDKEnvelope"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/EmailCodeData"}
    EmailAuthTokenEnvelope:
      allOf:
        - $ref: "#/components/schemas/SDKEnvelope"
        - type: object
          properties:
            data: {$ref: "#/components/schemas/EmailAuthTokenData"}
    LogoutEnvelope:
      allOf:
        - $ref: "#/components/schemas/SDKEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [logout]
              properties:
                logout: {type: boolean, const: true}
    SDKEnvelope:
      type: object
      required: [code, message, data, timestamp]
      properties:
        code: {type: integer, const: 0}
        message: {type: string, const: ok}
        data: {}
        timestamp: {type: integer, format: int64}
    AssetSpace:
      type: object
      required: [key, name, path]
      properties:
        key: {type: string, enum: [personal, apps, services]}
        name: {type: string}
        path: {type: string, pattern: "^/(personal|apps|services)$"}
    AssetSpacesEnvelope:
      allOf:
        - $ref: "#/components/schemas/SDKEnvelope"
        - type: object
          properties:
            data:
              type: object
              required: [defaultSpace, spaces]
              properties:
                defaultSpace: {type: string}
                spaces:
                  type: array
                  items: {$ref: "#/components/schemas/AssetSpace"}
    AssetObject:
      type: object
      required: [path, bucket, key, size, etag, contentType, modifiedAt, isPrefix]
      properties:
        path:
          type: string
          pattern: "^/(personal|apps|services)/.+"
        bucket:
          type: string
          enum: [personal, apps, services]
        key: {type: string}
        size: {type: integer, format: int64, minimum: 0}
        etag: {type: string}
        checksumSha256:
          type: string
          description: hex 编码的 SHA-256，仅单对象 metadata、download、write 响应返回
        contentType: {type: string}
        modifiedAt: {type: string, format: date-time}
        isPrefix: {type: boolean}
    AssetObjectList:
      type: object
      required: [prefix, objects, prefixes]
      properties:
        prefix:
          type: string
          pattern: "^/(personal|apps|services)(/.*)?$"
        objects:
          type: array
          items: {$ref: "#/components/schemas/AssetObject"}
        prefixes:
          type: array
          items:
            type: string
            pattern: "^/(personal|apps|services)/.*"
    AssetObjectError:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
    Quota:
      type: object
      required: [quota, used, available, percentage, unlimited]
      properties:
        quota: {type: integer, format: int64, minimum: 0}
        used: {type: integer, format: int64, minimum: 0}
        available: {type: integer, format: int64}
        percentage: {type: number, format: double}
        unlimited: {type: boolean}
    Permission:
      type: string
      enum: [read, create, update, delete]
    CredentialStatus:
      type: string
      enum: [active, revoked]
    WebDAVAccessKey:
      type: object
      required: [id, name, keyId, permissions, bindingPaths, status, createdAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        keyId: {type: string, example: ak_xxxxxxxxxxxxxxxx}
        permissions:
          type: array
          items: {$ref: "#/components/schemas/Permission"}
        bindingPaths:
          type: array
          items: {type: string}
        status: {$ref: "#/components/schemas/CredentialStatus"}
        expiresAt: {type: string}
        lastUsedAt: {type: string}
        createdAt: {type: string}
    CreateWebDAVAccessKeyRequest:
      type: object
      required: [name, rootPath, permissions]
      properties:
        name: {type: string, minLength: 1}
        rootPath:
          type: string
          minLength: 1
          example: /personal/documents
          description: 创建时立即绑定的 WebDAV 目录范围；密钥可访问该目录及其子目录。
        permissions:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: "#/components/schemas/Permission"}
        expiresValue: {type: integer, format: int64, minimum: 0}
        expiresUnit: {type: string, enum: [minute, hour, day, week, month, year, never]}
    CreatedWebDAVAccessKey:
      allOf:
        - $ref: "#/components/schemas/WebDAVAccessKey"
        - type: object
          required: [keySecret]
          properties:
            keySecret: {type: string, writeOnly: true}
    S3Credential:
      type: object
      required: [id, name, accessKeyId, rootPath, permissions, status, createdAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        accessKeyId: {type: string, example: AKxxxxxxxxxxxxxxxx}
        rootPath:
          type: string
          pattern: "^/(personal|apps|services)(/.*)?$"
          example: /personal/backup
        permissions:
          type: string
          example: read,create,update,delete
        status: {$ref: "#/components/schemas/CredentialStatus"}
        createdAt: {type: string}
    CreateS3CredentialRequest:
      type: object
      required: [name, permissions]
      properties:
        name: {type: string, minLength: 1, example: backup-s3-key}
        rootPath:
          type: string
          default: /personal
          pattern: "^/(personal|apps|services)(/.*)?$"
          example: /personal/backup
          description: Warehouse 服务端的 bucket/key prefix 授权范围
        permissions:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: "#/components/schemas/Permission"}
    CreatedS3Credential:
      allOf:
        - $ref: "#/components/schemas/S3Credential"
        - type: object
          required: [secret]
          properties:
            secret: {type: string, writeOnly: true}
            warning: {type: string}
    NotificationType:
      type: string
      enum: [quota, share, group_invite, system, admin_notice]
    Notification:
      type: object
      required: [id, type, title, content, severity, createdAt]
      properties:
        id: {type: string, format: uuid}
        type: {$ref: "#/components/schemas/NotificationType"}
        title: {type: string}
        content: {type: string}
        severity: {type: string, enum: [info, warning, error]}
        actionUrl:
          type: string
          description: 分组邀请形如 `#group-invite:<member-id>`
        readAt: {type: string}
        createdAt: {type: string}
    NotificationPreference:
      type: object
      required: [type, enabled]
      properties:
        type: {$ref: "#/components/schemas/NotificationType"}
        enabled: {type: boolean}
    CreateAnnouncementRequest:
      type: object
      required: [recipientRole, title, content]
      properties:
        recipientRole: {type: string, enum: [user, admin, all]}
        targetUsernames:
          type: array
          items: {type: string}
        title: {type: string, minLength: 1}
        content: {type: string, minLength: 1}
        severity: {type: string, enum: [info, warning, error], default: info}
        actionUrl: {type: string}
    Group:
      type: object
      required: [id, name, canManage, canInvite, createdAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        canManage: {type: boolean}
        canInvite: {type: boolean}
        createdAt: {type: string}
    GroupMember:
      type: object
      required: [id, name, alias, walletAddress, groupId, status, isOwner, isSelf, canManage, canRespond, createdAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        alias: {type: string}
        walletAddress: {$ref: "#/components/schemas/WalletAddress"}
        groupId: {type: string, format: uuid}
        status: {type: string, enum: [pending, active]}
        isOwner: {type: boolean}
        isSelf: {type: boolean}
        canManage: {type: boolean}
        canRespond: {type: boolean}
        createdAt: {type: string}
    CreateGroupMemberRequest:
      type: object
      required: [groupId]
      properties:
        target:
          type: string
          description: 用户名或钱包地址；为空时兼容读取 walletAddress
        walletAddress: {$ref: "#/components/schemas/WalletAddress"}
        alias: {type: string}
        groupId: {type: string, format: uuid}
    UpdateGroupMemberRequest:
      type: object
      required: [id]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        walletAddress: {$ref: "#/components/schemas/WalletAddress"}
        groupId: {type: string, format: uuid}
    RecycleItem:
      type: object
      required: [hash, name, path, size, deletedAt, directory, isDir]
      properties:
        hash: {type: string}
        name: {type: string}
        path: {type: string}
        size: {type: integer, format: int64, minimum: 0}
        deletedAt: {type: string, format: date-time}
        directory: {type: string}
        isDir: {type: boolean}
    RecycleList:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/RecycleItem"}
        total: {type: integer, minimum: 0}
        page: {type: integer, minimum: 1}
        pageSize: {type: integer, minimum: 1, maximum: 200}
    AdminRule:
      type: object
      required: [path, permissions, regex]
      properties:
        path: {type: string, minLength: 1}
        permissions:
          type: array
          items: {$ref: "#/components/schemas/Permission"}
        regex: {type: boolean}
    AdminUser:
      type: object
      required: [id, username, directory, permissions, quota, used_space, quota_status, has_password]
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        wallet_address: {$ref: "#/components/schemas/WalletAddress"}
        email: {type: string, format: email}
        directory: {type: string}
        permissions:
          type: array
          items: {$ref: "#/components/schemas/Permission"}
        quota: {type: integer, format: int64, minimum: 0}
        used_space: {type: integer, format: int64, minimum: 0}
        quota_status:
          type: string
          enum: [unlimited, over_quota, near_limit, ok]
        quota_usage_percent: {type: number, format: double, minimum: 0}
        rules:
          type: array
          items: {$ref: "#/components/schemas/AdminRule"}
        created_at: {type: string}
        updated_at: {type: string}
        has_password: {type: boolean}
    CreateAdminUserRequest:
      type: object
      required: [username]
      anyOf:
        - required: [password]
        - required: [wallet_address]
      properties:
        username: {type: string, minLength: 1}
        password: {type: string, format: password}
        wallet_address: {$ref: "#/components/schemas/WalletAddress"}
        email: {type: string, format: email}
        directory: {type: string}
        permissions:
          type: array
          items: {$ref: "#/components/schemas/Permission"}
        quota: {type: integer, format: int64, minimum: 0}
        rules:
          type: array
          items: {$ref: "#/components/schemas/AdminRule"}
    UpdateAdminUserRequest:
      type: object
      required: [username]
      properties:
        username: {type: string, minLength: 1, description: 待修改用户}
        new_username: {type: string, minLength: 1}
        wallet_address: {$ref: "#/components/schemas/WalletAddress"}
        email: {type: string, format: email}
        directory: {type: string, minLength: 1}
        permissions:
          type: array
          items: {$ref: "#/components/schemas/Permission"}
        quota: {type: integer, format: int64, minimum: 0}
        rules:
          type: array
          items: {$ref: "#/components/schemas/AdminRule"}
    AdminUsernameRequest:
      type: object
      required: [username]
      properties:
        username: {type: string, minLength: 1}
    ShareExpiry:
      type: object
      properties:
        expiresIn: {type: integer, format: int64, minimum: 0}
        expiresValue: {type: integer, format: int64, minimum: 0}
        expiresUnit: {type: string, enum: [minute, hour, day, week, month, year]}
    CreatePublicShareRequest:
      allOf:
        - $ref: "#/components/schemas/ShareExpiry"
        - type: object
          required: [path]
          properties:
            path: {type: string, minLength: 1}
            mode: {type: string, enum: [download, preview], default: download}
    PublicShare:
      type: object
      required: [token, name, path, mode, url, viewCount, downloadCount]
      properties:
        token: {type: string}
        name: {type: string}
        path: {type: string}
        mode: {type: string, enum: [download, preview]}
        url: {type: string, format: uri}
        viewCount: {type: integer, format: int64, minimum: 0}
        downloadCount: {type: integer, format: int64, minimum: 0}
        expiresAt: {type: string}
        createdAt: {type: string}
    CreateDirectedShareRequest:
      allOf:
        - $ref: "#/components/schemas/ShareExpiry"
        - type: object
          required: [path, targetMode, permissions]
          properties:
            path: {type: string, minLength: 1}
            targetAddresses:
              type: array
              items: {$ref: "#/components/schemas/WalletAddress"}
            targetMode: {type: string, enum: [addresses, groups, all_users]}
            groupIds:
              type: array
              items: {type: string, format: uuid}
            permissions:
              type: array
              minItems: 1
              items: {$ref: "#/components/schemas/Permission"}
    DirectedShare:
      type: object
      required: [id, name, path, isDir, permissions, createdAt]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        path: {type: string}
        isDir: {type: boolean}
        permissions:
          type: array
          items: {$ref: "#/components/schemas/Permission"}
        targetWallet: {type: string}
        targetType: {type: string, enum: [addresses, groups, all_users]}
        targetCount: {type: integer, minimum: 0}
        audienceCount: {type: integer, minimum: 0}
        targetGroups:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: {type: string, format: uuid}
              name: {type: string}
        allUsers: {type: boolean}
        ownerWallet: {type: string}
        ownerName: {type: string}
        expiresAt: {type: string}
        createdAt: {type: string}
    DirectedShareList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/DirectedShare"}
    ReceivedSharedResource:
      type: object
      required: [resourceId, name, path, isDir, permissions, grantCount, ownerName, createdAt]
      properties:
        resourceId: {type: string}
        name: {type: string}
        path: {type: string}
        isDir: {type: boolean}
        permissions: {type: array, items: {type: string, enum: [read, create, update, delete]}}
        grantCount: {type: integer, minimum: 1}
        ownerName: {type: string}
        ownerWallet: {type: string}
        createdAt: {type: string}
    ReceivedSharedResourceList:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: "#/components/schemas/ReceivedSharedResource"}}
    ShareAudience:
      type: object
      required: [type]
      properties:
        type: {type: string}
        targetUserId: {type: string, format: uuid}
        targetWallet: {type: string}
        sourceGroupId: {type: string, format: uuid}
        sourceGroupName: {type: string}
    ShareEntry:
      type: object
      required: [name, path, isDir, size, modified]
      properties:
        name: {type: string}
        path: {type: string}
        isDir: {type: boolean}
        size: {type: integer, format: int64, minimum: 0}
        modified: {type: string}
    SharePathRequest:
      type: object
      required: [shareId, path]
      properties:
        shareId: {type: string, format: uuid}
        path: {type: string, minLength: 1}
    ResourcePathRequest:
      type: object
      required: [resourceId, path]
      properties:
        resourceId: {type: string, minLength: 1}
        path: {type: string, minLength: 1}
    ResourceRenameRequest:
      type: object
      required: [resourceId, fromPath, toPath]
      properties:
        resourceId: {type: string, minLength: 1}
        fromPath: {type: string, minLength: 1}
        toPath: {type: string, minLength: 1}
    CreateUploadSessionRequest:
      type: object
      required: [path, size, chunkSize, fileName]
      properties:
        path: {type: string, minLength: 1}
        shareId: {type: string, format: uuid, description: 定向分享上传时填写}
        resourceId: {type: string, description: 收到的 V3 共享资源上传时填写；不可与 shareId 混用}
        size: {type: integer, format: int64, minimum: 0}
        chunkSize: {type: integer, format: int64, minimum: 1}
        fileName: {type: string, minLength: 1}
        contentType: {type: string}
        lastModified: {type: integer, format: int64}
    UploadSessionPart:
      type: object
      required: [partNumber, size, etag, checksumSha256, updatedAt]
      properties:
        partNumber: {type: integer, minimum: 1}
        size: {type: integer, format: int64, minimum: 0}
        etag: {type: string}
        checksumSha256: {type: string}
        updatedAt: {type: string, format: date-time}
    UploadSession:
      type: object
      required: [id, scope, path, size, chunkSize, fileName, status, createdAt, updatedAt, expiresAt, parts]
      properties:
        id: {type: string, format: uuid}
        scope: {type: string}
        path: {type: string}
        shareId: {type: string, format: uuid}
        resourceId: {type: string}
        size: {type: integer, format: int64, minimum: 0}
        chunkSize: {type: integer, format: int64, minimum: 1}
        fileName: {type: string}
        contentType: {type: string}
        lastModified: {type: integer, format: int64}
        status: {type: string}
        createdAt: {type: string}
        updatedAt: {type: string}
        expiresAt: {type: string}
        parts:
          type: array
          items: {$ref: "#/components/schemas/UploadSessionPart"}
    UploadPartResponse:
      type: object
      required: [session, part]
      properties:
        session: {$ref: "#/components/schemas/UploadSession"}
        part: {$ref: "#/components/schemas/UploadSessionPart"}

security:
  - bearerAuth: []

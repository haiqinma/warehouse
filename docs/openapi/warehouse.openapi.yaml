openapi: 3.1.0
info:
  title: Warehouse HTTP API
  version: 1.0.0
  description: |
    Warehouse 对外 JSON HTTP API 的正式契约。

    WebDAV (`/dav/*`) 和独立 S3 Endpoint 是协议适配层，不在本 OpenAPI
    规范中逐操作重复定义。WebDAV 请参阅用户使用指南，S3 请参阅
    `docs/S3设计方案.md`。
servers:
  - url: https://warehouse.tidukongjian.com
    description: Production
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Health
    description: 健康检查
  - name: Authentication
    description: 钱包、密码和刷新令牌认证
  - name: Assets
    description: 逻辑资产空间
  - name: User
    description: 当前用户信息和配额
  - name: WebDAV credentials
    description: WebDAV Basic Auth 访问密钥
  - name: S3 credentials
    description: AWS Signature V4 凭证
  - name: Notifications
    description: 用户通知、偏好和实时未读数
  - name: Groups
    description: 分组、成员和邀请处理
  - name: Recycle
    description: 回收站列表、恢复和永久删除
  - name: Admin notifications
    description: 需要管理员钱包权限的公告和管理通知
  - name: Admin users
    description: 需要管理员钱包权限的用户管理
  - name: Public shares
    description: 公开链接分享
  - name: Directed shares
    description: 按钱包、分组或全体用户的定向分享
  - name: Upload sessions
    description: 可恢复分片上传会话

paths:
  /api/v1/public/health/heartbeat:
    get:
      tags: [Health]
      operationId: getHeartbeat
      summary: 获取进程存活状态
      security: []
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/public/health/readiness:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: 检查数据库和存储等依赖是否就绪
      security: []
      responses:
        "200":
          description: 服务已就绪
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: 服务未就绪
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"

  /api/v1/public/auth/challenge:
    get:
      tags: [Authentication]
      operationId: getWalletChallenge
      summary: 获取钱包签名挑战
      security: []
      parameters:
        - name: address
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/WalletAddress"
      responses:
        "200":
          description: 挑战创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeEnvelope"
        "400":
          $ref: "#/components/responses/SDKBadRequest"
        "404":
          $ref: "#/components/responses/SDKNotFound"
    post:
      tags: [Authentication]
      operationId: createWalletChallenge
      summary: 使用 JSON 请求获取钱包签名挑战
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChallengeRequest"
      responses:
        "200":
          description: 挑战创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeEnvelope"
        "400":
          $ref: "#/components/responses/SDKBadRequest"
        "404":
          $ref: "#/components/responses/SDKNotFound"
  /api/v1/public/auth/verify:
    post:
      tags: [Authentication]
      operationId: verifyWalletSignature
      summary: 验证钱包签名并登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyWalletRequest"
      responses:
        "200":
          description: 登录成功，同时设置 HttpOnly refresh token Cookie
          headers:
            Set-Cookie:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenEnvelope"
        "400":
          $ref: "#/components/responses/SDKBadRequest"
        "401":
          $ref: "#/components/responses/SDKUnauthorized"
  /api/v1/public/auth/password/login:
    post:
      tags: [Authentication]
      operationId: loginWithPassword
      summary: 使用用户名和密码登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordLoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenEnvelope"
        "400":
          $ref: "#/components/responses/SDKBadRequest"
        "401":
          $ref: "#/components/responses/SDKUnauthorized"
  /api/v1/public/auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshAccessToken
      summary: 使用 refresh token Cookie 刷新令牌
      security:
        - refreshCookie: []
      responses:
        "200":
          description: 刷新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenEnvelope"
        "401":
          $ref: "#/components/responses/SDKUnauthorized"
  /api/v1/public/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: 退出登录并清除 refresh token Cookie
      security: []
      responses:
        "200":
          description: 退出成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutEnvelope"
  /api/v1/public/auth/email/code:
    post:
      tags: [Authentication]
      operationId: sendEmailLoginCode
      summary: 发送邮箱登录验证码
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email}
      responses:
        "200":
          description: 发送成功
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EmailCodeEnvelope"}
        "400": {$ref: "#/components/responses/SDKBadRequest"}
        "403": {$ref: "#/components/responses/SDKUnauthorized"}
        "429":
          description: 发送过于频繁
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SDKError"}
  /api/v1/public/auth/email/login:
    post:
      tags: [Authentication]
      operationId: loginWithEmailCode
      summary: 使用邮箱验证码登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: {type: string, format: email}
                code: {type: string, minLength: 1}
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EmailAuthTokenEnvelope"}
        "400": {$ref: "#/components/responses/SDKBadRequest"}
        "401": {$ref: "#/components/responses/SDKUnauthorized"}
        "403": {$ref: "#/components/responses/SDKUnauthorized"}
        "404": {$ref: "#/components/responses/SDKNotFound"}

  /api/v1/public/assets/spaces:
    get:
      tags: [Assets]
      operationId: listAssetSpaces
      summary: 获取当前用户的逻辑资产空间
      responses:
        "200":
          description: 资产空间列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetSpacesEnvelope"
        "401":
          $ref: "#/components/responses/SDKUnauthorized"
  /api/v1/public/assets/object:
    get:
      tags: [Assets]
      operationId: getAssetObjectMetadata
      summary: 获取当前用户资产对象元数据
      description: |
        通过 `/personal`、`/apps` 或 `/services` 开头的逻辑路径获取对象元数据。
        该接口用于 Knowledge 等上层服务读取 Warehouse 原始资产或回写资产的可验证元信息。
      parameters:
        - $ref: "#/components/parameters/AssetObjectPath"
      responses:
        "200":
          description: 对象元数据
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AssetObject"}
        "400": {$ref: "#/components/responses/AssetObjectError"}
        "401": {$ref: "#/components/responses/AssetObjectError"}
        "403": {$ref: "#/components/responses/AssetObjectError"}
        "404": {$ref: "#/components/responses/AssetObjectError"}
  /api/v1/public/assets/object/content:
    get:
      tags: [Assets]
      operationId: downloadAssetObjectContent
      summary: 下载当前用户资产对象内容
      parameters:
        - $ref: "#/components/parameters/AssetObjectPath"
      responses:
        "200":
          description: 对象内容
          headers:
            ETag:
              schema: {type: string}
            X-Warehouse-Checksum-SHA256:
              schema: {type: string}
            Content-Length:
              schema: {type: integer, format: int64}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        "400": {$ref: "#/components/responses/AssetObjectError"}
        "401": {$ref: "#/components/responses/AssetObjectError"}
        "403": {$ref: "#/components/responses/AssetObjectError"}
        "404": {$ref: "#/components/responses/AssetObjectError"}
    head:
      tags: [Assets]
      operationId: headAssetObjectContent
      summary: 获取当前用户资产对象内容头信息
      parameters:
        - $ref: "#/components/parameters/AssetObjectPath"
      responses:
        "200":
          description: 对象头信息
          headers:
            ETag:
              schema: {type: string}
            X-Warehouse-Checksum-SHA256:
              schema: {type: string}
            Content-Length:
              schema: {type: integer, format: int64}
        "400": {$ref: "#/components/responses/AssetObjectError"}
        "401": {$ref: "#/components/responses/AssetObjectError"}
        "403": {$ref: "#/components/responses/AssetObjectError"}
        "404": {$ref: "#/components/responses/AssetObjectError"}
    put:
      tags: [Assets]
      operationId: putAssetObjectContent
      summary: 写入当前用户资产对象内容
      description: |
        写入必须落在 `/personal`、`/apps` 或 `/services` 下，并复用现有 quota、
        mutation recorder 和对象 metadata 逻辑。`X-Warehouse-Checksum-SHA256`
        可传 hex 或 base64 编码的 SHA-256；提供时必须校验通过。
      parameters:
        - $ref: "#/components/parameters/AssetObjectPath"
        - name: X-Warehouse-Checksum-SHA256
          in: header
          required: false
          schema: {type: string}
          description: hex 或 base64 编码的 SHA-256 校验值
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
          text/plain:
            schema: {type: string}
          application/json:
            schema: {}
      responses:
        "200":
          description: 写入成功后的对象元数据
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AssetObject"}
        "400": {$ref: "#/components/responses/AssetObjectError"}
        "401": {$ref: "#/components/responses/AssetObjectError"}
        "403": {$ref: "#/components/responses/AssetObjectError"}
        "413": {$ref: "#/components/responses/AssetObjectError"}
  /api/v1/public/assets/objects:
    get:
      tags: [Assets]
      operationId: listAssetObjects
      summary: 列出当前用户资产对象
      parameters:
        - name: prefix
          in: query
          required: true
          schema:
            type: string
            pattern: "^/(personal|apps|services)(/.*)?$"
          example: /services/knowledge/
        - name: delimiter
          in: query
          required: false
          schema:
            type: string
            enum: ["/"]
          description: 传 `/` 时返回一层 common prefixes
      responses:
        "200":
          description: 对象列表
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AssetObjectList"}
        "400": {$ref: "#/components/responses/AssetObjectError"}
        "401": {$ref: "#/components/responses/AssetObjectError"}
        "403": {$ref: "#/components/responses/AssetObjectError"}
  /api/v1/public/webdav/quota:
    get:
      tags: [User]
      operationId: getCurrentUserQuota
      summary: 获取当前用户存储配额
      responses:
        "200":
          description: 配额信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quota"
        "401":
          $ref: "#/components/responses/LegacyError"
  /api/v1/public/webdav/user/info:
    get:
      tags: [User]
      operationId: getCurrentUser
      summary: 获取当前用户信息
      responses:
        "200":
          description: 用户信息
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/LegacyError"
  /api/v1/public/webdav/user/update:
    post:
      tags: [User]
      operationId: updateCurrentUsername
      summary: 修改当前用户名
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: {type: string, minLength: 1}
      responses:
        "200":
          description: 修改成功
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "400":
          $ref: "#/components/responses/LegacyError"
  /api/v1/public/webdav/user/password:
    post:
      tags: [User]
      operationId: updateCurrentUserPassword
      summary: 设置或修改当前用户密码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: {type: string, format: password, minLength: 1}
      responses:
        "200":
          description: 修改成功
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        "400":
          $ref: "#/components/responses/LegacyError"

  /api/v1/public/webdav/access-keys/list:
    get:
      tags: [WebDAV credentials]
      operationId: listWebDAVAccessKeys
      summary: 列出 WebDAV 访问密钥
      responses:
        "200":
          description: 密钥列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/WebDAVAccessKey"}
        "401":
          $ref: "#/components/responses/PlainTextError"
  /api/v1/public/webdav/access-keys/create:
    post:
      tags: [WebDAV credentials]
      operationId: createWebDAVAccessKey
      summary: 创建 WebDAV 访问密钥
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWebDAVAccessKeyRequest"
      responses:
        "200":
          description: 创建成功，keySecret 只在本次响应中返回
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedWebDAVAccessKey"
        "400":
          $ref: "#/components/responses/PlainTextError"
        "409":
          $ref: "#/components/responses/PlainTextError"
  /api/v1/public/webdav/access-keys/bind:
    post:
      tags: [WebDAV credentials]
      operationId: bindWebDAVAccessKeyPath
      summary: 将 WebDAV 密钥绑定到资产路径
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, path]
              properties:
                id: {type: string, format: uuid}
                path: {type: string, example: /personal/documents}
      responses:
        "200":
          $ref: "#/components/responses/MessageResponse"
        "400":
          $ref: "#/components/responses/PlainTextError"
        "404":
          $ref: "#/components/responses/PlainTextError"
  /api/v1/public/webdav/access-keys/revoke:
    post:
      tags: [WebDAV credentials]
      operationId: revokeWebDAVAccessKey
      summary: 撤销 WebDAV 访问密钥
      requestBody:
        $ref: "#/components/requestBodies/IDRequest"
      responses:
        "200":
          $ref: "#/components/responses/MessageResponse"
        "400":
          $ref: "#/components/responses/PlainTextError"
        "404":
          $ref: "#/components/responses/PlainTextError"
  /api/v1/public/webdav/access-keys/delete:
    post:
      tags: [WebDAV credentials]
      operationId: deleteWebDAVAccessKey
      summary: 删除已撤销的 WebDAV 访问密钥
      requestBody:
        $ref: "#/components/requestBodies/IDRequest"
      responses:
        "200":
          $ref: "#/components/responses/MessageResponse"
        "400":
          $ref: "#/components/responses/PlainTextError"
        "404":
          $ref: "#/components/responses/PlainTextError"

  /api/v1/public/s3/credentials/list:
    get:
      tags: [S3 credentials]
      operationId: listS3Credentials
      summary: 列出 S3 凭证
      responses:
        "200":
          description: S3 凭证列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/S3Credential"}
        "401":
          $ref: "#/components/responses/PlainTextError"
  /api/v1/public/s3/credentials/create:
    post:
      tags: [S3 credentials]
      operationId: createS3Credential
      summary: 创建 S3 凭证
      description: |
        rootPath 是 Warehouse 服务端权限范围，不是 S3 标准凭证字段。
        `/personal/backup` 表示 `personal` bucket 下的 `backup/` Object Key prefix。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateS3CredentialRequest"
      responses:
        "200":
          description: 创建成功，secret 只在本次响应中返回
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedS3Credential"
        "400":
          $ref: "#/components/responses/PlainTextError"
        "401":
          $ref: "#/components/responses/PlainTextError"
  /api/v1/public/s3/credentials/revoke:
    post:
      tags: [S3 credentials]
      operationId: revokeS3Credential
      summary: 撤销 S3 凭证
      requestBody:
        $ref: "#/components/requestBodies/IDRequest"
      responses:
        "200":
          description: 撤销成功，当前实现返回空响应体
        "400":
          $ref: "#/components/responses/PlainTextError"
        "404":
          $ref: "#/components/responses/PlainTextError"
  /api/v1/public/s3/credentials/delete:
    post:
      tags: [S3 credentials]
      operationId: deleteS3Credential
      summary: 删除已撤销的 S3 凭证
      requestBody:
        $ref: "#/components/requestBodies/IDRequest"
      responses:
        "200":
          $ref: "#/components/responses/MessageResponse"
        "400":
          $ref: "#/components/responses/PlainTextError"
        "404":
          $ref: "#/components/responses/PlainTextError"

  /api/v1/public/notifications/list:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: 列出当前用户通知
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, default: 20}
      responses:
        "200":
          description: 通知列表
          content:
            application/json:
              schema:
                type: object
                required: [items, canAnnounce]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Notification"}
                  canAnnounce: {type: boolean}
        "401": {$ref: "#/components/responses/LegacyError"}
  /api/v1/public/notifications/unread-count:
    get:
      tags: [Notifications]
      operationId: getNotificationUnreadCount
      summary: 获取未读通知数
      responses:
        "200":
          description: 未读数
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count: {type: integer, minimum: 0}
        "401": {$ref: "#/components/responses/LegacyError"}
  /api/v1/public/notifications/read:
    post:
      tags: [Notifications]
      operationId: markNotificationsRead
      summary: 批量标记通知已读
      requestBody: {$ref: "#/components/requestBodies/IDsRequest"}
      responses:
        "200": {$ref: "#/components/responses/MessageResponse"}
        "400": {$ref: "#/components/responses/LegacyError"}
  /api/v1/public/notifications/read-all:
    post:
      tags: [Notifications]
      operationId: markAllNotificationsRead
      summary: 标记所有通知已读
      responses:
        "200": {$ref: "#/components/responses/MessageResponse"}
        "401": {$ref: "#/components/responses/LegacyError"}
  /api/v1/public/notifications/preferences:
    get:
      tags: [Notifications]
      operationId: listNotificationPreferences
      summary: 获取通知偏好
      responses:
        "200":
          description: 偏好列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/NotificationPreference"}
        "401": {$ref: "#/components/responses/LegacyError"}
    post:
      tags: [Notifications]
      operationId: setNotificationPreference
      summary: 设置通知偏好
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NotificationPreference"}
      responses:
        "200": {$ref: "#/components/responses/MessageResponse"}
        "400": {$ref: "#/components/responses/LegacyError"}
  /api/v1/public/notifications/stream:
    get:
      tags: [Notifications]
      operationId: streamNotificationUnreadCount
      summary: 订阅未读数 SSE 流
      description: 立即发送一次 `unread` 事件，之后约每 30 秒发送。
      responses:
        "200":
          description: Server-Sent Events 流
          content:
            text/event-stream:
              schema: {type: string}
              example: "event: unread\ndata: {\"count\":2}\n\n"
        "401": {$ref: "#/components/responses/LegacyError"}

  /api/v1/public/webdav/group/groups:
    get:
      tags: [Groups]
      operationId: listGroups
      summary: 列出当前用户可见分组
      responses:
        "200":
          description: 分组列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Group"}
        "401": {$ref: "#/components/responses/PlainTextError"}
  /api/v1/public/webdav/group/groups/create:
    post:
      tags: [Groups]
      operationId: createGroup
      summary: 创建分组
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1}
      responses:
        "200":
          description: 创建的分组
